name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Extract section between this tag and the previous one
          NOTES=$(awk "/^## \[${VERSION#v}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create release archive
        run: |
          mkdir -p release
          cp -r backend release/
          cp -r frontend/dist release/frontend-dist
          cp docker-compose.yml Makefile .env.example release/
          tar -czf "netops-ai-${GITHUB_REF_NAME}.tar.gz" -C release .

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.notes }}
          files: "netops-ai-*.tar.gz"
          fail_on_unmatched_files: true
