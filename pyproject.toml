[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # bandit (security)
    "T20",  # no print statements in production
]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess with shell — reviewed case by case
    "B008",  # function call in default arg — FastAPI Depends pattern
    "T201",  # print — needed in scripts
]
per-file-ignores = { "backend/tests/*" = ["S", "T20"], "backend/test.py" = ["T20"] }

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
files = ["backend"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
strict = false
exclude = ["backend/venv", "backend/tests"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/venv/*", "backend/tests/*", "backend/test.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
